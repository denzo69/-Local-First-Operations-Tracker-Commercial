{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">{{ t.new_purchase_order }}</h1>
<form method="post" action="/products/purchasing" class="card border-0 shadow-sm"><div class="card-body row g-3">
  <div class="col-md-6"><label class="form-label" for="supplier_id">{{ t.supplier }}</label><select class="form-select" id="supplier_id" name="supplier_id" required><option value="">{{ t.select_supplier }}</option>{% for supplier in suppliers %}<option value="{{ supplier.id }}">{{ supplier.name }}</option>{% endfor %}</select></div>
  <div class="col-md-6"><label class="form-label" for="expected_date">{{ t.expected_delivery }}</label><input class="form-control" type="date" id="expected_date" name="expected_date"></div>
  {% if not is_authenticated %}<div class="col-md-6"><label class="form-label" for="created_by_user_id">Created by</label><select class="form-select" id="created_by_user_id" name="created_by_user_id" required>{% for user in users %}<option value="{{ user.id }}">{{ user.name }}</option>{% endfor %}</select></div>{% endif %}
  <div class="col-12"><label class="form-label" for="notes">{{ t.notes }}</label><textarea class="form-control" id="notes" name="notes" rows="3"></textarea></div>
</div><div class="card-footer bg-white d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="/products/purchasing">{{ t.cancel }}</a><button class="btn btn-primary">{{ t.create_draft }}</button></div></form>
{% endblock %}
