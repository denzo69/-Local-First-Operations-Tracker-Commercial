<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labels — {{ product.name }}</title><style>
</style></head><body><div class="toolbar"><button onclick="window.print()">{{ t.print_labels }}</button> <form style="display:inline" method="get"><label for="copies">{{ t.copies }}</label> <input id="copies" type="number" name="copies" min="1" max="100" value="{{ copies }}"> <button>{{ t.update }}</button></form> <a href="/products/{{ product.id }}">{{ t.back_to_product }}</a></div><div class="labels">{% for _ in range(copies) %}<div class="label"><div class="name">{{ product.name }}</div><div class="barcode">{{ barcode_svg|safe }}</div><div class="sku">SKU {{ product.sku }}{% if barcode_value != product.sku %} · {{ barcode_value }}{% endif %}</div></div>{% endfor %}</div></body></html>
